MANZIL_MODE: "production"
MANZIL_SERVICE_ROLE: "worker"
HOST: "0.0.0.0"
FIREBASE_PROJECT_ID: "manzil-app-v1"
ALLOWED_HOSTS: "manzil-source-worker-488497279747.asia-southeast1.run.app,manzil-source-worker-ld6lwscfya-as.a.run.app"
ALLOWED_ORIGINS: "https://manzil-app-v1.web.app"
